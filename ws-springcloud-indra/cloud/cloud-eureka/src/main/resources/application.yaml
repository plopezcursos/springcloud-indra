spring:
  application:
    name: cloud-eureka
server:
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  app:
    name: servidor-eureka
    description: Servidor de Registro
    version: 1.0.0