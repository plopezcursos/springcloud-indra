spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
server:
  port: 8083
resilience4j:
  circuitbreaker:
    instances:
      SaludoClientobtenerSaludo:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      SaludoClientobtenerSaludoDemora:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    instances:
      SaludoClientobtenerSaludoDemora:
        timeout-duration: 1s
